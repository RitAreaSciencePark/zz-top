[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zztop"
version = "0.8.0"
description = "Unified zigzag persistence pipeline for simplicial and cubical complexes"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.8"
authors = [
    {name = "Matteo Biagetti"},
]
keywords = ["topology", "persistent-homology", "zigzag", "cubical-complex", "TDA"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "gudhi>=3.5",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
plot = ["matplotlib>=3.4"]
torch = ["torch>=1.9"]
all = ["zztop[test,plot]"]

[project.urls]
Homepage = "https://github.com/matteobiagetti/zz-top"
Repository = "https://github.com/matteobiagetti/zz-top"
Issues = "https://github.com/matteobiagetti/zz-top/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["zztop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
